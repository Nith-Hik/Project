<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Bookstore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="site-header">
		<div class="header-container">
			<h1><a href="index.html">Bookstore</a></h1>
			<nav>
				<ul>
					<li><a href="index.html">Home</a></li>
					<li><a href="catalog.html">Books</a></li>
					<li><a href="cart.html">Cart</a></li>
					<li><a href="login.html" class="active">Login</a></li>
				</ul>
			</nav>
			<form class="search-form" action="search.html" method="get">
				<input type="text" name="q" placeholder="Search for books..." aria-label="Search books">
				<button type="submit">Search</button>
			</form>
		</div>
	</header>

	<main class="main-container">
		<section class="auth-page">
			<div class="auth-card">
				<h2>Welcome Back</h2>
				<p class="auth-subtitle">Log in to your account</p>

				<form action="login" method="post" class="auth-form">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="yours@example.com" required>

					<label for="password">Password</label>
					<input type="password" id="password" name="password" placeholder="Enter your password" required>

					<button type="submit" class="auth-btn">Log In</button>
				</form>

				<p class="auth-switch">
					Don't have an account? <a href="register">Create one</a>
				</p>
			</div>
		</section>
	</main>

	<footer>
		<div class="footer-container">
			<p>&copy; 2026 Online Bookstore. All rights reserved.</p>
		</div>
	</footer>
</body>
</html>
